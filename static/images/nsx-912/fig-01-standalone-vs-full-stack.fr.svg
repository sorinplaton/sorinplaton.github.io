<text x="80" y="514" font-size="11" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">LIMITES</text>
<text x="80" y="532.0" font-size="12.1" fill="#1d2733" text-anchor="start">Le mode Multi NSX Manager avec un seul vCenter n'est pas pris en charge en autonome. Pas de mise à niveau autonome pour un NSX qui fait partie d'un VCF complet.</text>
<text x="80" y="549.6" font-size="12.1" fill="#1d2733" text-anchor="start">La convergence d'un NSX autonome vers un VCF complet crée un domaine de gestion et ne peut pas être annulée.</text>
