<text x="472" y="302.0" font-size="13" fill="#1d2733" font-weight="bold">Argo CD instance</text>
<text x="472" y="318.0" font-size="12" fill="#6b7785">OIDC client, registered automatically</text>
<text x="472" y="334.0" font-size="12" fill="#6b7785">login: no admin password handed out</text>
