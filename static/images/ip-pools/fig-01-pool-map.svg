<rect x="900" y="348" width="412" height="18" rx="9" fill="#2e7d32"/>
<text x="1106.0" y="361" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Private Transit Gateway IP Block  (NSX, visibility: Private)</text>
<text x="900" y="378" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">feeds Private-TGW subnets · reachable by every VPC on this TGW · never advertised (9.1: /16)</text>
