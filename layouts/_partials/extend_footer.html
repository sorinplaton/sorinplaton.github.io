{{- with site.Params.goatcounter }}
{{- if hugo.IsProduction }}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{{- end }}
{{- end }}
<script>
// Click a post image or diagram to enlarge it in place; click anywhere, press Esc or the × to shrink it back.
(function () {
  var root = document.querySelector('.post-content');
  if (!root) return;
  var items = [].filter.call(root.querySelectorAll('img, figure svg'), function (el) {
    if (el.closest('a')) return false;                                   // linked images keep their link
    if (el.tagName.toLowerCase() === 'svg') return !el.parentElement.closest('svg') && el.viewBox && el.viewBox.baseVal && el.viewBox.baseVal.width;
    return true;
  });
  if (!items.length) return;
  var overlay, lastFocus;
  var fr = document.documentElement.lang.indexOf('fr') === 0;
  function close() {
    if (!overlay) return;
    var o = overlay; overlay = null;
    o.classList.remove('lb-open');
    document.body.classList.remove('lb-lock');
    setTimeout(function () { o.remove(); }, 180);
    if (lastFocus) lastFocus.focus();
  }
  // An inline SVG is styled by its post's scoped CSS (.evpn figure svg, .tepless .diagram ...),
  // so rebuild its ancestor chain (tag + class) around the copy to keep the same colours and fonts.
  function svgCopy(svg) {
    var chain = [], el = svg.parentElement;
    while (el && el !== document.body) { chain.unshift(el); if (el === root) break; el = el.parentElement; }
    var outer, inner;
    chain.forEach(function (a) {
      var w = document.createElement(a.tagName.toLowerCase());
      w.className = a.className;
      w.setAttribute('style', 'margin:0;width:auto;max-width:none;min-width:0;overflow:visible;align-self:auto');
      if (inner) inner.appendChild(w); else outer = w;
      inner = w;
    });
    var vb = svg.viewBox.baseVal, big = svg.cloneNode(true);
    var wpx = Math.min(window.innerWidth * 0.94 - 64, (window.innerHeight - 160) * vb.width / vb.height);
    big.style.cssText = 'display:block;width:' + Math.max(wpx, 200) + 'px;max-width:none;height:auto';
    big.removeAttribute('width'); big.removeAttribute('height');
    inner.appendChild(big);
    var card = document.createElement('div');
    card.className = 'lb-svg';
    card.appendChild(outer);
    return card;
  }
  function open(el) {
    lastFocus = el;
    overlay = document.createElement('div');
    overlay.className = 'lb-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', fr ? 'Image agrandie' : 'Enlarged image');
    var btn = document.createElement('button');
    btn.className = 'lb-close';
    btn.type = 'button';
    btn.setAttribute('aria-label', fr ? "Fermer l'image agrandie" : 'Close enlarged image');
    btn.innerHTML = '&times;';
    overlay.appendChild(btn);
    if (el.tagName.toLowerCase() === 'img') {
      var big = document.createElement('img');
      big.src = el.currentSrc || el.src;
      big.alt = el.alt;
      overlay.appendChild(big);
    } else {
      overlay.appendChild(svgCopy(el));
    }
    var fig = el.closest('figure'), cap = fig && fig.querySelector('figcaption');
    if (cap) { var c = document.createElement('div'); c.className = 'lb-caption'; c.textContent = cap.textContent; overlay.appendChild(c); }
    overlay.addEventListener('click', close);
    document.body.appendChild(overlay);
    document.body.classList.add('lb-lock');
    requestAnimationFrame(function () { overlay && overlay.classList.add('lb-open'); });
    btn.focus();
  }
  items.forEach(function (el) {
    el.classList.add('lb-zoomable');
    el.setAttribute('tabindex', '0');
    el.addEventListener('click', function () { open(el); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el); } });
  });
  document.addEventListener('keydown', function (e) { if (overlay && (e.key === 'Escape' || e.key === 'Tab')) { e.preventDefault(); close(); } });
})();
</script>
