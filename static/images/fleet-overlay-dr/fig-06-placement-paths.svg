<text x="342" y="448" font-size="13.2" fill="#5b3fa0" text-anchor="middle">VCF Automation service runtime</text>
<text x="342" y="465" font-size="12.1" fill="#6b7785" text-anchor="middle">same subnet as VCF Operations · IP mobility for DR</text>
<rect x="850" y="355.0" width="440" height="10" rx="5.0" fill="#8a6d00"/>
<text x="925" y="346" font-size="13.2" fill="#8a6d00" text-anchor="start" font-weight="bold">VM management VLAN · per site, not stretched</text>
