<text x="403.85063445261136" y="416.8" font-size="13.2" fill="#b23a3a" text-anchor="end">&lt; 5 ms RTT (primary/replica/data)</text>
<path d="M537.5438611701979,292 L537.5438611701979,120" fill="none" stroke="#b23a3a" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="537.5" cy="292" r="4" fill="#b23a3a"/>
<text x="529.5438611701979" y="90.0" font-size="13.2" fill="#b23a3a" text-anchor="end">NSX single-manager multisite with</text>
<text x="529.5438611701979" y="106.8" font-size="13.2" fill="#b23a3a" text-anchor="end">automatic mgmt-plane recovery ≤ 10 ms</text>
<path d="M537.5438611701979,330 L537.5438611701979,332" fill="none" stroke="#0b7a75" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="537.5" cy="308" r="4" fill="#0b7a75"/>
<text x="545.5438611701979" y="350.0" font-size="13.2" fill="#0b7a75" text-anchor="start">VCF Operations Continuous Availability</text>
<text x="545.5438611701979" y="366.8" font-size="13.2" fill="#0b7a75" text-anchor="start">between fault domains &lt; 10 ms (peaks ≤ 20 ms)</text>
<path d="M736.7629121122154,292 L736.7629121122154,180" fill="none" stroke="#0b7a75" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="736.8" cy="292" r="4" fill="#0b7a75"/>
<text x="744.7629121122154" y="150.0" font-size="13.2" fill="#0b7a75" text-anchor="start">Ops CA witness ↔ fault domains</text>
<text x="744.7629121122154" y="166.8" font-size="13.2" fill="#0b7a75" text-anchor="start">≤ 30 ms</text>
<path d="M829.3944956228092,330 L829.3944956228092,342" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="829.4" cy="308" r="4" fill="#2e7d32"/>
