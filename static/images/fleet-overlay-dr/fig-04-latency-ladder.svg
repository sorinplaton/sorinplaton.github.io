erUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7785"/></marker><marker id="arrms" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#6b7785"/></marker></defs>
<text x="700.0" y="30" text-anchor="middle" font-size="23" font-weight="bold">Inter-site latency against the published limits</text>
<text x="700.0" y="56" text-anchor="middle" font-size="14" fill="#6b7785">Each dot is a documented latency ceiling; the shaded band is where a two-instance DR design with a stretched segment applies</text>
