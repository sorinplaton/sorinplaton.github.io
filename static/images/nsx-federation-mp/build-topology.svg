<text x="780" y="425" font-size="12" fill="#6b7785" text-anchor="start">lab router · NAT 10.0.6.33</text>
<path d="M790,635 L530,635" fill="none" stroke="#5b3fa0" stroke-width="1.8" marker-end="url(#mp)"/>
<circle cx="660" cy="635" r="11" fill="#5b3fa0"/>
