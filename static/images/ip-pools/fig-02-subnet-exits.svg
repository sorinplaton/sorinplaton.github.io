<text x="150" y="640" fill="#1f4e9c" font-size="11" text-anchor="start" font-weight="bold">VM 10.60.0.70 → ToR</text>
<text x="150" y="657" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">no NAT: the VM's own address is already</text>
<text x="150" y="671" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">part of the advertised External block.</text>
<text x="150" y="690" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">Reachable from outside directly.</text>
<text x="560" y="640" fill="#5b3fa0" font-size="11" text-anchor="start" font-weight="bold">VM 10.244.1.10 → SNAT at VPC GW</text>
<text x="560" y="657" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">leaves as 10.60.0.5 (one External IP per VPC),</text>
<text x="560" y="671" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">or gets a 1:1 NAT External IP if published.</text>
<text x="560" y="690" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">Not reachable from other VPCs.</text>
<text x="970" y="640" fill="#2e7d32" font-size="11" text-anchor="start" font-weight="bold">VM 10.250.3.10 → other VPCs: routed</text>
<text x="970" y="657" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">by the Transit GW, no NAT inside the project.</text>
<text x="970" y="671" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">To leave the project: SNAT at the TGW to an</text>
<text x="970" y="685" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">External IP — or extended as-is through the</text>
<text x="970" y="699" fill="#6b7785" font-size="11" text-anchor="start" font-style="italic">external connection (9.1 'Private IP Blocks' switch).</text>
<rect x="367" y="138" width="293" height="18" rx="9" fill="#1f4e9c"/>
<text x="513.5" y="151" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">only External-block addresses pass the ToR</text>
<rect x="209" y="212" width="451" height="18" rx="9" fill="#2e7d32"/>
<text x="434.5" y="225" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Private-TGW → SNAT'd here to an External IP (unless extended, 9.1)</text>
<rect x="334" y="338" width="326" height="18" rx="9" fill="#6b7785"/>
<text x="497.0" y="351" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Public and Private-TGW addresses pass unchanged</text>
<rect x="334" y="468" width="326" height="18" rx="9" fill="#5b3fa0"/>
<text x="497.0" y="481" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Private → SNAT / 1:1 NAT here to an External IP</text>
<rect x="400" y="488" width="260" height="18" rx="9" fill="#6b7785"/>
<text x="530.0" y="501" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Public and Private-TGW pass unchanged</text>
<rect x="60" y="822" width="1280" height="22" fill="#1f4e9c"/>
<text x="68" y="838" fill="#ffffff" font-weight="bold" font-size="12">Subnet type</text>
<text x="198" y="838" fill="#ffffff" font-weight="bold" font-size="12">Address comes from</text>
<text x="548" y="838" fill="#ffffff" font-weight="bold" font-size="12">Advertised north?</text>
<text x="748" y="838" fill="#ffffff" font-weight="bold" font-size="12">NAT point</text>
<text x="1058" y="838" fill="#ffffff" font-weight="bold" font-size="12">Reachable from</text>
<rect x="60" y="844" width="1280" height="22" fill="#f4f7fb" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="68" y="860" font-size="11">Public</text>
<text x="198" y="860" font-size="11">External IP Block</text>
<text x="548" y="860" font-size="11">yes, as itself</text>
<text x="748" y="860" font-size="11">none</text>
<text x="1058" y="860" font-size="11">anywhere the block is routed</text>
<rect x="60" y="866" width="1280" height="22" fill="#ffffff" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="68" y="882" font-size="11">Private</text>
<text x="198" y="882" font-size="11">VPC Private CIDR (vCenter) / org Private IP Block (VCFA)</text>
<text x="548" y="882" font-size="11">only via NAT</text>
<text x="748" y="882" font-size="11">VPC Gateway (SNAT or 1:1 NAT from External block)</text>
<text x="1058" y="882" font-size="11">inside the VPC only</text>
<rect x="60" y="888" width="1280" height="22" fill="#f4f7fb" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="68" y="904" font-size="11">Private-TGW</text>
<text x="198" y="904" font-size="11">Private Transit Gateway IP Block</text>
<text x="548" y="904" font-size="11">no (9.1: optional extension)</text>
<text x="748" y="904" font-size="11">Transit Gateway (SNAT from External block)</text>
<text x="1058" y="904" font-size="11">every VPC on the same TGW</text>
<rect x="60" y="910" width="1280" height="22" fill="#ffffff" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="68" y="926" font-size="11">Transit</text>
<text x="198" y="926" font-size="11">100.64.0.0/16 (auto)</text>
<text x="548" y="926" font-size="11">no</text>
<text x="748" y="926" font-size="11">—</text>
<text x="1058" y="926" font-size="11">TGW ↔ VPC gateway only</text>
</svg>