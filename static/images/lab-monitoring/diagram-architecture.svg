<text x="1022" y="136" font-size="12" fill="#6b7785">Argo CD https://10.204.204.3</text>
<rect x="40" y="200" width="900" height="560" rx="5" fill="#f7f9fb" stroke="#1d2733" stroke-width="1.6"/>
<text x="70" y="470" font-size="13" fill="#1d2733" font-weight="bold">Management domain</text>
<text x="70" y="490" font-size="12" fill="#6b7785">Supervisor supervisor-mgmt-a, rebuilt</text>
<text x="70" y="506" font-size="12" fill="#6b7785">with NSX VPC networking (vc-mgmt-a,</text>
<text x="70" y="522" font-size="12" fill="#6b7785">cluster-mgmt-01a)</text>
<text x="70" y="546" font-size="12" fill="#6b7785">VPC vpc-platform-ops, private 172.24.0.0/23</text>
<text x="70" y="562" font-size="12" fill="#6b7785">external block 10.204.204.0/24, VLAN 204</text>
<rect x="70" y="235" width="300" height="165" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="82" y="257" font-size="13" fill="#1d2733" font-weight="bold">Namespace platform-ops-mj3pd</text>
<text x="82" y="275" font-size="12" fill="#6b7785">ArgoCD argocd-platform (VCF Service)</text>
<text x="82" y="291" font-size="12" fill="#6b7785">Argo CD 3.4.4, LB 10.204.204.3</text>
<text x="82" y="307" font-size="12" fill="#6b7785">ManagedEntity: namespace, mon-mgmt</text>
<text x="82" y="323" font-size="12" fill="#6b7785">Applications:</text>
<text x="82" y="339" font-size="12" fill="#6b7785">  mon-mgmt-cluster, monitoring-stack,</text>
<text x="82" y="355" font-size="12" fill="#6b7785">  monitoring-exporters</text>
<rect x="420" y="235" width="490" height="500" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="432" y="257" font-size="13" fill="#1d2733" font-weight="bold">VKS cluster mon-mgmt</text>
<text x="432" y="275" font-size="12" fill="#6b7785">builtin-generic-v3.7.0, Kubernetes v1.35.6, Photon 5</text>
<text x="432" y="291" font-size="12" fill="#6b7785">1 control plane + 2 workers</text>
<rect x="445" y="305" width="270" height="215" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="457" y="327" font-size="13" fill="#1d2733" font-weight="bold">kube-prometheus-stack 92.17.0</text>
<text x="457" y="345" font-size="12" fill="#6b7785">Helm chart, synced by Argo CD</text>
<text x="457" y="361" font-size="12" fill="#6b7785">Prometheus 3.15</text>
<text x="457" y="377" font-size="12" fill="#6b7785">  15 days, 30 GB PVC on vSAN</text>
<text x="457" y="393" font-size="12" fill="#6b7785">Grafana 13.3, LB 10.204.204.6</text>
<text x="457" y="409" font-size="12" fill="#6b7785">Alertmanager, kube-state-metrics</text>
<text x="457" y="425" font-size="12" fill="#6b7785">node-exporter on each node</text>
<text x="457" y="441" font-size="12" fill="#6b7785">  (TCP 9100, node firewall rule)</text>
<rect x="735" y="305" width="150" height="100" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="747" y="327" font-size="13" fill="#1d2733" font-weight="bold">vmware-exporter</text>
<text x="747" y="345" font-size="12" fill="#6b7785">pryorda v0.18.4</text>
<text x="747" y="361" font-size="12" fill="#6b7785">3 vCenter sections</text>
<rect x="735" y="420" width="150" height="100" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="747" y="442" font-size="13" fill="#1d2733" font-weight="bold">idrac-exporter</text>
<text x="747" y="460" font-size="12" fill="#6b7785">mrlhansen 2.6.3</text>
<text x="747" y="476" font-size="12" fill="#6b7785">Redfish, one</text>
<text x="747" y="492" font-size="12" fill="#6b7785">?target per iDRAC</text>
<rect x="445" y="545" width="440" height="80" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="457" y="567" font-size="13" fill="#1d2733" font-weight="bold">Secrets made once, outside Git</text>
<text x="457" y="585" font-size="12" fill="#6b7785">vcenter-exporter-env, idrac-exporter-config</text>
<text x="457" y="601" font-size="12" fill="#6b7785">one user, monitor, read-only on every target</text>
<rect x="445" y="640" width="440" height="80" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="457" y="662" font-size="13" fill="#1d2733" font-weight="bold">Dashboards in Git</text>
