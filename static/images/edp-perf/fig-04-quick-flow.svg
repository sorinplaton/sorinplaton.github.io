<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="525" viewBox="0 0 1380 525" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1d2733">
<rect width="1380" height="525" fill="#ffffff"/>
<defs><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d2733"/></marker><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e9c"/></marker><marker id="at" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0b7a75"/></marker><marker id="ap" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b3fa0"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3261e"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7785"/></marker></defs>
<text x="690" y="34" text-anchor="middle" font-size="19" fill="#1d2733" font-weight="bold">What I did, end to end: on, then off again</text>
<text x="690" y="56" text-anchor="middle" font-size="12" fill="#6b7785">Cluster edp-cluster, 3 hosts. A ping between two overlay VMs ran every 200 ms through both runs.</text>
<text x="30" y="96" text-anchor="start" font-size="15" fill="#5b3fa0" font-weight="bold">Enable EDP Performance</text>
<rect x="30" y="110" width="240" height="110" rx="8" fill="#f4f6f8" stroke="#1d2733" stroke-width="2.2"/>
<text x="150.0" y="142" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Start</text>
<text x="150.0" y="168" text-anchor="middle" font-size="11.5" fill="#1d2733">all hosts STANDARD</text>
<text x="150.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7785">cluster TNP edp-tnp</text>
<line x1="272" y1="165" x2="302" y2="165" stroke="#5b3fa0" stroke-width="2" marker-end="url(#ap)"/>
<rect x="304" y="110" width="240" height="110" rx="8" fill="#ffffff" stroke="#5b3fa0" stroke-width="2.2"/>
<text x="424.0" y="142" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Prepare once</text>
<text x="424.0" y="168" text-anchor="middle" font-size="11.5" fill="#1d2733">TNP edp-tnp-ens: ENS, 2 lcores</text>
<text x="424.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7785">vCenter: allow vMotion between modes</text>
<line x1="546" y1="165" x2="576" y2="165" stroke="#5b3fa0" stroke-width="2" marker-end="url(#ap)"/>
<rect x="578" y="110" width="240" height="110" rx="8" fill="#ffffff" stroke="#5b3fa0" stroke-width="2.2"/>
<text x="698.0" y="142" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Empty the host</text>
<text x="698.0" y="168" text-anchor="middle" font-size="11.5" fill="#1d2733">vMotion VMs away</text>
<text x="698.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7785">enter maintenance mode</text>
<line x1="820" y1="165" x2="850" y2="165" stroke="#5b3fa0" stroke-width="2" marker-end="url(#ap)"/>
<rect x="852" y="110" width="240" height="110" rx="8" fill="#ffffff" stroke="#5b3fa0" stroke-width="2.2"/>
<text x="972.0" y="142" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Two hops</text>
<text x="972.0" y="168" text-anchor="middle" font-size="11.5" fill="#1d2733">STANDARD → ENS_INTERRUPT → ENS</text>
<text x="972.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7785">~10 s each, verify, exit MM</text>
<line x1="1094" y1="165" x2="1124" y2="165" stroke="#5b3fa0" stroke-width="2" marker-end="url(#ap)"/>
<rect x="1126" y="110" width="240" height="110" rx="8" fill="#f4f6f8" stroke="#1d2733" stroke-width="2.2"/>
<text x="1246.0" y="142" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Finish</text>
<text x="1246.0" y="168" text-anchor="middle" font-size="11.5" fill="#1d2733">attach edp-tnp-ens to the cluster</text>
<text x="1246.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7785">state SUCCESS</text>
<path d="M1052,222 L1052,248 L638,248 L638,224" fill="none" stroke="#6b7785" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<text x="845.0" y="242" text-anchor="middle" font-size="12" fill="#6b7785" font-weight="bold">repeat for esx-edp-01, 02, 03, one host at a time</text>
<text x="690" y="270" text-anchor="middle" font-size="12.5" fill="#5b3fa0" font-weight="bold">Ping loss: 4 of 2,880 (0.14 %), all during vMotions</text>
<text x="30" y="326" text-anchor="start" font-size="15" fill="#1f4e9c" font-weight="bold">Remove it again</text>
<rect x="30" y="340" width="240" height="110" rx="8" fill="#f4f6f8" stroke="#1d2733" stroke-width="2.2"/>
<text x="150.0" y="372" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Start</text>
<text x="150.0" y="398" text-anchor="middle" font-size="11.5" fill="#1d2733">all hosts ENS</text>
<text x="150.0" y="420" text-anchor="middle" font-size="11.5" fill="#6b7785">cluster TNP edp-tnp-ens</text>
<line x1="272" y1="395" x2="302" y2="395" stroke="#1f4e9c" stroke-width="2" marker-end="url(#ab)"/>
<rect x="304" y="340" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="424.0" y="372" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Nothing to prepare</text>
<text x="424.0" y="398" text-anchor="middle" font-size="11.5" fill="#1d2733">edp-tnp still exists</text>
<text x="424.0" y="420" text-anchor="middle" font-size="11.5" fill="#6b7785">(STANDARD profile)</text>
<line x1="546" y1="395" x2="576" y2="395" stroke="#1f4e9c" stroke-width="2" marker-end="url(#ab)"/>
<rect x="578" y="340" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="698.0" y="372" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Empty the host</text>
<text x="698.0" y="398" text-anchor="middle" font-size="11.5" fill="#1d2733">vMotion VMs away</text>
<text x="698.0" y="420" text-anchor="middle" font-size="11.5" fill="#6b7785">enter maintenance mode</text>
<line x1="820" y1="395" x2="850" y2="395" stroke="#1f4e9c" stroke-width="2" marker-end="url(#ab)"/>
<rect x="852" y="340" width="240" height="110" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="972.0" y="372" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Two hops</text>
<text x="972.0" y="398" text-anchor="middle" font-size="11.5" fill="#1d2733">ENS → ENS_INTERRUPT → STANDARD</text>
<text x="972.0" y="420" text-anchor="middle" font-size="11.5" fill="#6b7785">~10 s each, verify, exit MM</text>
<line x1="1094" y1="395" x2="1124" y2="395" stroke="#1f4e9c" stroke-width="2" marker-end="url(#ab)"/>
<rect x="1126" y="340" width="240" height="110" rx="8" fill="#f4f6f8" stroke="#1d2733" stroke-width="2.2"/>
<text x="1246.0" y="372" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Finish</text>
<text x="1246.0" y="398" text-anchor="middle" font-size="11.5" fill="#1d2733">attach edp-tnp to the cluster</text>
<text x="1246.0" y="420" text-anchor="middle" font-size="11.5" fill="#6b7785">state SUCCESS</text>
<path d="M1052,452 L1052,478 L638,478 L638,454" fill="none" stroke="#6b7785" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
<text x="845.0" y="472" text-anchor="middle" font-size="12" fill="#6b7785" font-weight="bold">repeat for esx-edp-01, 02, 03, one host at a time</text>
<text x="690" y="500" text-anchor="middle" font-size="12.5" fill="#1f4e9c" font-weight="bold">Ping loss: 8 of 2,305 (0.35 %), all during vMotions</text></svg>