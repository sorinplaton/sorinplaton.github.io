<text x="560" y="34" text-anchor="middle" font-size="19" fill="#1d2733" font-weight="bold">The lab: three nested ESX 8.0 U3i hosts on a Dell R730xd</text>
<text x="560" y="56" text-anchor="middle" font-size="12" fill="#6b7785">Functional test bed. Nested numbers say nothing about EDP throughput; they do show what the mode change costs.</text>
<rect x="30" y="80" width="1060" height="470" rx="10" fill="#ffffff" stroke="#6b7785" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="104" text-anchor="start" font-size="12.5" fill="#6b7785" font-weight="bold">Physical host: Dell R730xd 10.0.6.6 · outer VDS nested-lab (MTU 9000, no uplinks, MAC learning)</text>
<rect x="60" y="125" width="300" height="90" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="1.8"/>
<text x="210" y="155" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">vc-edp.corp.local</text>
<text x="210" y="177" text-anchor="middle" font-size="12" fill="#1d2733">vCenter 8.0 U3 · 10.0.6.50</text>
<text x="210" y="197" text-anchor="middle" font-size="12" fill="#6b7785">cluster edp-cluster</text>
<rect x="410" y="125" width="300" height="90" rx="8" fill="#ffffff" stroke="#5b3fa0" stroke-width="1.8"/>
<text x="560" y="155" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">nsx-edp.corp.local</text>
