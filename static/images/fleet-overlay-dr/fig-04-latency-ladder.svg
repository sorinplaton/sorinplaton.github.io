<text x="837.3944956228092" y="376.8" font-size="13.2" fill="#2e7d32" text-anchor="start">(vCenter, NSX) &lt; 50 ms</text>
<path d="M1028.6135465648267,292 L1028.6135465648267,180" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="1028.6" cy="292" r="4" fill="#2e7d32"/>
<text x="1036.6135465648267" y="150.0" font-size="13.2" fill="#2e7d32" text-anchor="start">NSX Federation, stretched networks</text>
<text x="1036.6135465648267" y="166.8" font-size="13.2" fill="#2e7d32" text-anchor="start">GM ↔ locations ≤ 150 ms</text>
<path d="M1154.3067732824136,330 L1154.3067732824136,342" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="1154.3" cy="308" r="4" fill="#2e7d32"/>
<text x="1162.3067732824136" y="360.0" font-size="13.2" fill="#2e7d32" text-anchor="start">VCF Operations nodes → cloud proxy</text>
<text x="1162.3067732824136" y="376.8" font-size="13.2" fill="#2e7d32" text-anchor="start">&lt; 300 ms (9.x sizing guide)</text>
<rect x="60" y="448" width="1280" height="66" rx="6" fill="#f4f7fb" stroke="none" stroke-width="1.4"/>
<text x="76" y="468" font-size="12.0" fill="#b23a3a" text-anchor="start" font-weight="bold" letter-spacing="1.5">BELOW 5 MS</text>
<text x="76" y="486.0" font-size="13.2" fill="#1d2733" text-anchor="start">Stretched-cluster territory: vSAN stretched, single-manager NSX multisite.</text>
<text x="76" y="504.0" font-size="13.2" fill="#1d2733" text-anchor="start">Above 5 ms: two instances, two management domains — DR, not HA.</text>
<text x="720" y="468" font-size="12.0" fill="#2e7d32" text-anchor="start" font-weight="bold" letter-spacing="1.5">INSIDE THE BAND</text>
<text x="720" y="486.0" font-size="13.2" fill="#1d2733" text-anchor="start">Federation (≤ 150 ms), collectors, cloud proxies and vSphere Replication are all within limits.</text>
<text x="720" y="504.0" font-size="13.2" fill="#1d2733" text-anchor="start">Below 10 ms, VCF Operations can run Continuous Availability across both sites instead of being replicated.</text>
