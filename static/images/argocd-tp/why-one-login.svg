<text x="600.0" y="30" font-size="19" fill="#1d2733" text-anchor="middle" font-weight="bold">One login: the Argo CD UI hands you to VCF Automation, no admin password exists</text>
<rect x="70" y="100" width="30" height="24" rx="3" fill="#ffffff" stroke="#1d2733" stroke-width="1.8"/>
<path d="M77 108l5 4-5 4M85 117h8" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round"/>
<text x="112" y="112" font-size="12" fill="#1d2733" font-weight="bold">You, browser or vcf CLI</text>
<text x="112" y="128" font-size="12" fill="#6b7785">log in via VCF Automation</text>
<text x="112" y="144" font-size="12" fill="#6b7785">vcf argocd login --sso</text>
<rect x="760" y="85" width="400" height="84" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="772" y="116.0" font-size="13" fill="#1d2733" font-weight="bold">VCF Automation</text>
<text x="772" y="132.0" font-size="12" fill="#6b7785">org holo-east, OIDC provider</text>
<text x="772" y="148.0" font-size="12" fill="#6b7785">client, redirect URIs, PKCE</text>
<circle cx="430" cy="300" r="16" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
