<path d="M1150,650 L1460,650 L1460,323" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mg)"/>
<circle cx="1460" cy="400" r="11" fill="#2e7d32"/>
<text x="1460" y="404.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="1475" y="404" font-size="12" fill="#2e7d32" text-anchor="start">collected data</text>
<rect x="40" y="740" width="1520" height="32" fill="#233648"/>
<text x="52" y="761" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">Step</text>
<text x="132" y="761" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">Runs on</text>
<text x="462" y="761" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">What happens</text>
<line x1="40" y1="808" x2="1560" y2="808" stroke="#d8dee3"/>
<text x="52" y="795" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">1</text>
<text x="132" y="795" font-size="14" fill="#1d2733" text-anchor="start">jump host</text>
<text x="462" y="795" font-size="14" fill="#1d2733" text-anchor="start">The repository is cloned from GitHub.</text>
<rect x="40" y="808" width="1520" height="36" fill="#f7f9fa"/>
<line x1="40" y1="844" x2="1560" y2="844" stroke="#d8dee3"/>
<text x="52" y="831" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">2</text>
<text x="132" y="831" font-size="14" fill="#1d2733" text-anchor="start">jump host</text>
<text x="462" y="831" font-size="14" fill="#1d2733" text-anchor="start">mp-build, in the tooling container, builds the adapter image and the .pak, and pushes the image to the registry.</text>
<line x1="40" y1="880" x2="1560" y2="880" stroke="#d8dee3"/>
<text x="52" y="867" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">3</text>
<text x="132" y="867" font-size="14" fill="#1d2733" text-anchor="start">jump host</text>
<text x="462" y="867" font-size="14" fill="#1d2733" text-anchor="start">tools/repack.py writes the registry address 10.0.6.27:5000 into the .pak; the image digest stays the same.</text>
<rect x="40" y="880" width="1520" height="36" fill="#f7f9fa"/>
<line x1="40" y1="916" x2="1560" y2="916" stroke="#d8dee3"/>
<text x="52" y="903" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">4</text>
<text x="132" y="903" font-size="14" fill="#1d2733" text-anchor="start">jump host to VCF Operations</text>
<text x="462" y="903" font-size="14" fill="#1d2733" text-anchor="start">The unsigned PAK switch is turned on, the .pak is installed, and the switch is turned off again.</text>
<line x1="40" y1="952" x2="1560" y2="952" stroke="#d8dee3"/>
<text x="52" y="939" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">5</text>
<text x="132" y="939" font-size="14" fill="#1d2733" text-anchor="start">VCF Operations to cloud proxy</text>
<text x="462" y="939" font-size="14" fill="#1d2733" text-anchor="start">Creating the account deploys the adapter instance on the cloud proxy.</text>
<rect x="40" y="952" width="1520" height="36" fill="#f7f9fa"/>
<line x1="40" y1="988" x2="1560" y2="988" stroke="#d8dee3"/>
<text x="52" y="975" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">6</text>
<text x="132" y="975" font-size="14" fill="#1d2733" text-anchor="start">cloud proxy</text>
<text x="462" y="975" font-size="14" fill="#1d2733" text-anchor="start">Docker pulls the image by digest from the registry, over HTTPS, trusting its certificate.</text>
<line x1="40" y1="1024" x2="1560" y2="1024" stroke="#d8dee3"/>
<text x="52" y="1011" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">7</text>
<text x="132" y="1011" font-size="14" fill="#1d2733" text-anchor="start">cloud proxy to NSX</text>
<text x="462" y="1011" font-size="14" fill="#1d2733" text-anchor="start">The adapter reads the Global Managers and the Local Managers through their REST API.</text>
<rect x="40" y="1024" width="1520" height="36" fill="#f7f9fa"/>
<line x1="40" y1="1060" x2="1560" y2="1060" stroke="#d8dee3"/>
<text x="52" y="1047" font-size="14" fill="#1d2733" text-anchor="start" font-weight="bold">8</text>
<text x="132" y="1047" font-size="14" fill="#1d2733" text-anchor="start">cloud proxy to VCF Operations</text>
<text x="462" y="1047" font-size="14" fill="#1d2733" text-anchor="start">Metrics, properties and events go to the analytics node.</text>
</svg>