<text x="700" y="30" font-size="19" fill="#1d2733" text-anchor="middle" font-weight="bold">Lab monitoring: Argo CD on the management domain builds the cluster and the stack</text>
<text x="700" y="50" font-size="12" fill="#6b7785" text-anchor="middle">Blue: Git pull. Black: sign-in and role. Green: what Argo CD creates. Grey: Prometheus scrapes. Amber: read-only calls to the lab.</text>
<rect x="60" y="80" width="330" height="82" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="72" y="102" font-size="13" fill="#1d2733" font-weight="bold">GitHub: sorinplaton/vcf-gitops</text>
<text x="72" y="120" font-size="12" fill="#6b7785">branch mgmt-platform-ops</text>
<text x="72" y="136" font-size="12" fill="#6b7785">clusters/mon-mgmt, apps/monitoring</text>
<rect x="535" y="80" width="330" height="82" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="547" y="102" font-size="13" fill="#1d2733" font-weight="bold">VCF Automation</text>
<text x="547" y="120" font-size="12" fill="#6b7785">org platform-ops, region mgmt-a</text>
<text x="547" y="136" font-size="12" fill="#6b7785">SSO for Argo CD, service account role</text>
<rect x="1010" y="80" width="330" height="82" rx="5" fill="#ffffff" stroke="#c9d1da" stroke-width="1.6"/>
<text x="1022" y="102" font-size="13" fill="#1d2733" font-weight="bold">You (browser)</text>
