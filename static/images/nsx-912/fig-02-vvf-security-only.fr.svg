<text x="952" y="100" font-size="11" fill="#6b7785" text-anchor="start" font-weight="bold" letter-spacing="1.5">ABSENT DE CE MODÈLE</text>
<text x="960" y="140" font-size="13.2" fill="#9aa5b1" text-anchor="start" font-weight="bold">Réseau overlay</text>
<line x1="960" y1="154" x2="1340" y2="154" stroke="#9aa5b1" stroke-width="8" stroke-dasharray="18 10"/>
<text x="960" y="184" font-size="12.1" fill="#6b7785" text-anchor="start">non disponible dans ce modèle de déploiement</text>
<rect x="940" y="230" width="420" height="195" rx="6" fill="#f4f7fb" stroke="#1d2733" stroke-width="1.4"/>
<text x="956" y="254" font-size="11" fill="#1d2733" text-anchor="start" font-weight="bold" letter-spacing="1.5">COMMENT NSX ARRIVE</text>
<text x="956" y="284" font-size="12.6" fill="#1d2733" text-anchor="start">Le VCF Installer n'installe pas NSX</text>
<text x="956" y="302" font-size="12.6" fill="#1d2733" text-anchor="start">pour un déploiement VVF.</text>
<text x="956" y="320" font-size="12.6" fill="#1d2733" text-anchor="start"></text>
<text x="956" y="338" font-size="12.6" fill="#1d2733" text-anchor="start">Le NSX autonome prend en charge la plateforme</text>
<text x="956" y="356" font-size="12.6" fill="#1d2733" text-anchor="start">NSX pour le virtual patching de vDefend.</text>
<rect x="60" y="445" width="1280" height="64" rx="6" fill="#fff7e6" stroke="none"/>
<text x="80" y="467" font-size="11" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">MON CROQUIS</text>
<text x="80" y="485.0" font-size="12.1" fill="#1d2733" text-anchor="start">Le guide NSX ne donne pas de topologie pour ce modèle. Il dit seulement : un NSX Manager allégé, restreint à une configuration limitée à la sécurité,</text>
<text x="80" y="502.6" font-size="12.1" fill="#1d2733" text-anchor="start">sans les fonctions de réseau overlay. La procédure d'activation pas à pas se trouve dans une rubrique distincte à laquelle le guide renvoie.</text>
