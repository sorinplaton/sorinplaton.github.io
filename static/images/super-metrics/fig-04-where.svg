<rect x="700" y="95" width="800" height="120" rx="0" fill="#eef4fb" stroke="#c9d1da" stroke-width="1"/>
<text x="716" y="125" font-family="Menlo, Consolas, monospace" font-size="13">avg(${adaptertype=VMWARE, objecttype=VirtualMachine,</text>
<text x="716" y="147" font-family="Menlo, Consolas, monospace" font-size="13">    metric=cpu|usage_average, depth=2,</text>
<text x="716" y="169" font-family="Menlo, Consolas, monospace" font-size="13" fill="#5b3fa0" font-weight="bold">    where=(${metric=sys|poweredOn} == 1)</text>
<text x="716" y="191" font-family="Menlo, Consolas, monospace" font-size="13">})</text>
<text x="700" y="250" font-size="16" fill="#1d2733" text-anchor="start" font-weight="bold">= avg(40, 70) = </text>
<text x="850" y="250" font-size="16" fill="#1f4e9c" text-anchor="start" font-weight="bold">55 %</text>
<rect x="700" y="290" width="380" height="24" rx="0" fill="#1f4e9c" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="306" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">Rule</text>
<rect x="1080" y="290" width="420" height="24" rx="0" fill="#1f4e9c" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="306" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">Consequence</text>
<rect x="700" y="314" width="380" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="330" font-size="12" fill="#1d2733" text-anchor="start">Reads only the same object’s metrics</text>
<rect x="1080" y="314" width="420" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="330" font-size="12" fill="#1d2733" text-anchor="start">Cannot compare a VM to its cluster’s SLA</text>
<rect x="700" y="338" width="380" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="354" font-size="12" fill="#1d2733" text-anchor="start">Right operand is a number</text>
<rect x="1080" y="338" width="420" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="354" font-size="12" fill="#1d2733" text-anchor="start">Not another super metric or a variable</text>
<rect x="700" y="362" width="380" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="378" font-size="12" fill="#1d2733" text-anchor="start">String operators allowed</text>
<rect x="1080" y="362" width="420" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="378" font-size="12" fill="#1d2733" text-anchor="start">"… !contains GENERAL" style tests</text>
<rect x="700" y="386" width="380" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="402" font-size="12" fill="#1d2733" text-anchor="start">$value is the entry’s own value</text>
<rect x="1080" y="386" width="420" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="402" font-size="12" fill="#1d2733" text-anchor="start">where=($value > 60) for a threshold</text>
<rect x="700" y="410" width="380" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="708" y="426" font-size="12" fill="#1d2733" text-anchor="start">$value.isFresh()</text>
<rect x="1080" y="410" width="420" height="24" rx="0" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
<text x="1088" y="426" font-size="12" fill="#1d2733" text-anchor="start">Ignore stale last values</text>
<text x="60" y="500" font-size="11" fill="#6b7785" text-anchor="start" font-style="italic">Values are illustrative.</text>
</svg>
