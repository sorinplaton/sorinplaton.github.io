<text x="700.0" y="30" font-size="21" fill="#1d2733" text-anchor="middle" font-weight="bold">Static TEP IP and MAC, now in the transport node profile</text>
<text x="700.0" y="54" font-size="13" fill="#6b7785" text-anchor="middle">How a host tunnel endpoint gets its address, and what NSX 9.1.2 adds</text>
