<text x="738" y="427" text-anchor="start" font-weight="bold">VPC Gateway</text>
<text x="738" y="442" text-anchor="start" fill="#6b7785" font-size="12">SNAT / 1:1 NAT for Private subnets · LB VIPs</text>
