<text x="540" y="345" font-size="13.2" fill="#1d2733" text-anchor="middle">ESX 3</text>
<text x="540" y="361" font-size="12.1" fill="#6b7785" text-anchor="middle">TEP vmk · static IP and MAC</text>
<text x="720" y="100" font-size="11" fill="#6b7785" text-anchor="start" font-weight="bold" letter-spacing="1.5">HOW A HOST TEP GETS ITS ADDRESS</text>
<rect x="720" y="112" width="640" height="24" fill="#1f4e9c"/>
<text x="730" y="129" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">Address option</text>
<text x="980" y="129" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">Where it applies</text>
<rect x="720" y="136" width="640" height="28" fill="#f4f7fb" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="730" y="154" font-size="12" fill="#1d2733" text-anchor="start">DHCP</text>
<text x="980" y="154" font-size="12" fill="#1d2733" text-anchor="start">TNP or single host</text>
<rect x="720" y="164" width="640" height="28" fill="#ffffff" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="730" y="182" font-size="12" fill="#1d2733" text-anchor="start">IP pool</text>
<text x="980" y="182" font-size="12" fill="#1d2733" text-anchor="start">TNP or single host</text>
<rect x="720" y="192" width="640" height="28" fill="#f4f7fb" stroke="#d9e0ea" stroke-width="0.8"/>
<text x="730" y="210" font-size="12" fill="#1d2733" text-anchor="start">Static IP list</text>
<text x="980" y="210" font-size="12" fill="#1d2733" text-anchor="start">single host only (KB 431877)</text>
<rect x="720" y="220" width="640" height="28" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.4"/>
<text x="730" y="238" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="bold">Static IP and MAC</text>
<text x="980" y="238" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="bold">in the TNP · new in 9.1.2</text>
<text x="720" y="278" font-size="13.2" fill="#2e7d32" text-anchor="start" font-weight="bold">✓  no ARP conflicts, no false override detection</text>
<text x="742" y="295" font-size="12.1" fill="#6b7785" text-anchor="start">in vSphere configuration profiles</text>
<rect x="60" y="395" width="1280" height="64" rx="6" fill="#fff7e6" stroke="none"/>
<text x="80" y="417" font-size="11" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">TERMS</text>
<text x="80" y="435.0" font-size="12.1" fill="#1d2733" text-anchor="start">TEP (tunnel endpoint): the VMkernel adapter on each host that carries overlay traffic.</text>
<text x="80" y="452.6" font-size="12.1" fill="#1d2733" text-anchor="start">TNP (transport node profile): the template that gives every host in a cluster the same NSX switch settings, TEP addressing included.</text>
</svg>
