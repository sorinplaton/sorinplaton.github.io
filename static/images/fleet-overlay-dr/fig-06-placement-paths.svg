<circle cx="1118" cy="413.6666666666667" r="1.4" fill="#5b3fa0"/>
<text x="1082" y="448" font-size="13.2" fill="#5b3fa0" text-anchor="middle">VCF Automation service runtime</text>
<text x="1082" y="465" font-size="12.1" fill="#6b7785" text-anchor="middle">next to vCenter and SDDC Manager · no network choice offered</text>
<text x="330" y="500" font-size="13.2" fill="#2e7d32" text-anchor="middle" font-weight="bold">✓  the only path that lands Automation on the segment</text>
<text x="1070" y="500" font-size="13.2" fill="#b23a3a" text-anchor="middle" font-weight="bold">✗  fine for a single site, wrong for the stretched design</text>
<rect x="60" y="530" width="1280" height="64" rx="6" fill="#fff7e6" stroke="none" stroke-width="1.4"/>
<text x="80" y="552" font-size="11.0" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">IN BOTH CASES</text>
<text x="80" y="570.0" font-size="12.1" fill="#1d2733" text-anchor="start">The cloud proxy stays on the VM management VLAN in every case; it is site-specific and collects locally.</text>
<text x="80" y="587.6" font-size="12.1" fill="#1d2733" text-anchor="start">Brownfield is different: after an upgrade to 9.1, Operations and Automation on NSX VLAN-backed segments remain fully supported (KB 443842) — no migration required.</text>
</svg>
