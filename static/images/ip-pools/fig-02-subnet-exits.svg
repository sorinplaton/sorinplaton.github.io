<text x="700.0" y="30" text-anchor="middle" font-size="19" font-weight="bold">Inside one VPC: three subnet types, three ways to leave</text>
<text x="700.0" y="50" text-anchor="middle" font-size="12" fill="#6b7785">Which block the address comes from, where NAT happens, and what the ToR sees</text>
