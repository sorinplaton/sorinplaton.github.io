<text x="720.232090508719" y="434" font-size="14.4" fill="#8a6d00" text-anchor="middle" font-weight="bold">beyond the stretched-cluster limit: two-instance DR with NSX Federation (5 ms &lt; RTT ≤ 150 ms) · Ops CA possible only below 10 ms</text>
