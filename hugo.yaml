baseURL: "https://sorinplaton.github.io/"
title: "Sorin Platon"
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    locale: en-us
    weight: 1
    menus:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 30
        - identifier: search
          name: Search
          url: /search/
          weight: 40
        - identifier: about
          name: About
          url: /about/
          weight: 50
  fr:
    label: Français
    locale: fr-ca
    weight: 2
    title: "Sorin Platon"
    params:
      description: "Notes de terrain sur VMware Cloud Foundation — NSX, EVPN, BGP, VKS et Kubernetes, VCF Automation et Operations, IA privée — construites et cassées dans un lab Holodeck."
      homeInfoParams:
        Title: "VMware Cloud Foundation, mis par écrit."
        Content: >
          Notes de terrain, du lab comme du terrain, sur toute la pile VCF :
          NSX, EVPN/VXLAN et ingénierie de trafic BGP ; VKS et Kubernetes ;
          VCF Automation, GitOps avec Argo CD, VCF Operations et son
          assistant IA sur un LLM privé. Des configurations qui fonctionnent,
          les pièges qu'elles cachent et pourquoi elles ont cette forme. Tout
          est construit, cassé et réparé sur un Holodeck VCF 9.1 imbriqué avant
          d'approcher la production.
      editPost:
        URL: "https://github.com/sorinplaton/sorinplaton.github.io/tree/main/content"
        Text: "Suggérer des modifications"
        appendFilePath: true
    menus:
      main:
        - identifier: posts
          name: Articles
          url: /fr/posts/
          weight: 10
        - identifier: tags
          name: Étiquettes
          url: /fr/tags/
          weight: 20
        - identifier: projects
          name: Projets
          url: /fr/projects/
          weight: 30
        - identifier: search
          name: Recherche
          url: /fr/search/
          weight: 40
        - identifier: about
          name: À propos
          url: /fr/about/
          weight: 50

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  images: ["/images/share-default.jpg"]
  goatcounter: "sorinplaton"   # stats at https://sorinplaton.goatcounter.com
  analytics:
    google:
      SiteVerificationTag: "E99iaS6Ozyezzb4hK7x17204TqhuZ-GA0m0Md4j6TsU"   # Google Search Console; PaperMod renders <meta name="google-site-verification">
  title: "Sorin Platon"
  description: "Field notes on VMware Cloud Foundation — NSX, EVPN, BGP, VKS and Kubernetes, VCF Automation and Operations, private AI — built and broken on a Holodeck lab."
  author: "Sorin Platon"
  keywords: [VCF, VMware Cloud Foundation, Holodeck, NSX, EVPN, VXLAN, BGP, VKS, Kubernetes, VCF Automation, VCF Operations, Argo CD, private AI, Ollama, networking]
  DateFormat: "2 January 2006"
  defaultTheme: auto
  disableThemeToggle: false
  displayFullLangName: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true

  assets:
    disableHLJS: true
    favicon: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"

  label:
    text: "sorin platon"
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="50" height="50" rx="10"/><line x1="18" y1="32" x2="46" y2="32"/><line x1="32" y1="18" x2="32" y2="46"/><path d="M18 32l7-4v8z" fill="currentColor"/><path d="M46 32l-7-4v8z" fill="currentColor"/><path d="M32 18l-4 7h8z" fill="currentColor"/><path d="M32 46l-4-7h8z" fill="currentColor"/></svg>'
    iconHeight: 22

  homeInfoParams:
    Title: "VMware Cloud Foundation, written down."
    Content: >
      Field notes from the lab and the field, across the whole VCF stack:
      NSX, EVPN/VXLAN and BGP traffic engineering; VKS and Kubernetes;
      VCF Automation, GitOps with Argo CD, VCF Operations and its AI
      Assistant on a private LLM. Working configs, the traps they contain,
      and why they look the way they do. All of it is built, broken and
      fixed on a nested VCF 9.1 Holodeck before it gets anywhere near
      production.

  socialIcons:
    - name: github
      url: "https://github.com/sorinplaton"
    - name: linkedin
      url: "https://www.linkedin.com/in/sorin-platon-0bb6973/"
    - name: rss
      url: "/index.xml"

  editPost:
    URL: "https://github.com/sorinplaton/sorinplaton.github.io/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github
  tableOfContents:
    startLevel: 2
    endLevel: 3
