erUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7785"/></marker><marker id="arrms" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#6b7785"/></marker></defs>
<text x="700.0" y="30" text-anchor="middle" font-size="21" font-weight="bold">Two ways to add VCF Automation after bring-up — only one lets you choose the network</text>
<text x="700.0" y="54" text-anchor="middle" font-size="13" fill="#6b7785">Decide the segment before anyone opens the Lifecycle page in VCF Operations</text>
<rect x="500" y="80" width="400" height="56" rx="6" fill="#f4f7fb" stroke="#1d2733" stroke-width="1.4"/>
<text x="700" y="104" font-size="15.4" fill="#1d2733" text-anchor="middle" font-weight="bold">VCF Automation skipped at bring-up</text>
<text x="700" y="124" font-size="12.1" fill="#6b7785" text-anchor="middle">the defer option in the VCF Installer</text>
<path d="M700,136 L700,170 L160,170 L160,200" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M700,170 L900,170 L900,200" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="110" y="200" width="440" height="90" rx="6" fill="#f4f7fb" stroke="#2e7d32" stroke-width="1.6"/>
<circle cx="132" cy="222" r="11" fill="#2e7d32"/>
<text x="132" y="226.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="150" y="227" font-size="14.3" fill="#1d2733" text-anchor="start" font-weight="bold">VCF Installer › Deployment Wizard › Deploy deferred components</text>
<text x="124" y="250.0" font-size="13.2" fill="#6b7785" text-anchor="start">Asks for the network: a vDS port group or an NSX segment</text>
<text x="124" y="268.7" font-size="13.2" fill="#6b7785" text-anchor="start">Takes the FQDNs and the 5-IP range for the service runtime</text>
<rect x="850" y="200" width="440" height="90" rx="6" fill="#f4f7fb" stroke="#b23a3a" stroke-width="1.6"/>
<circle cx="872" cy="222" r="11" fill="#b23a3a"/>
<text x="872" y="226.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="890" y="227" font-size="14.3" fill="#1d2733" text-anchor="start" font-weight="bold">VCF Operations › Build › Lifecycle › VCF Management Components</text>
<text x="864" y="250.0" font-size="13.2" fill="#6b7785" text-anchor="start">No network choice — the service runtime goes on the</text>
<text x="864" y="268.7" font-size="13.2" fill="#6b7785" text-anchor="start">management network, the Installer's default port group</text>
<path d="M160,290 L160,352" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M900,290 L900,352" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="110" y="355.0" width="440" height="10" rx="5.0" fill="#1f4e9c"/>
<text x="185" y="346" font-size="13.2" fill="#1f4e9c" text-anchor="start" font-weight="bold">seg-vcf-mgmt · NSX overlay segment (stretchable with Federation)</text>
