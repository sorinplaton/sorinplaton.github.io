<text x="560" y="197" text-anchor="middle" font-size="12" fill="#6b7785">TNPs edp-tnp / edp-tnp-ens</text>
<rect x="760" y="125" width="300" height="90" rx="8" fill="#ffffff" stroke="#6b7785" stroke-width="1.8"/>
<text x="910" y="155" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Impact probe</text>
<text x="910" y="177" text-anchor="middle" font-size="12" fill="#1d2733">edp-vm1 → edp-vm2 over overlay</text>
<text x="910" y="197" text-anchor="middle" font-size="12" fill="#6b7785">ping every 200 ms, timestamped</text>
