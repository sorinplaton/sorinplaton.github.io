<text x="560" y="34" text-anchor="middle" font-size="19" fill="#1d2733" font-weight="bold">NSX 4.2.4 host switch modes: which changes are accepted</text>
<text x="560" y="56" text-anchor="middle" font-size="12" fill="#6b7785">Tested per host (API and UI wizard); the cluster TNP rejects STANDARD → ENS the same way. Each arrow = one change on one host in maintenance mode, ~10 s to realize.</text>
<rect x="20" y="130" width="260" height="120" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.4"/>
<text x="150" y="162" text-anchor="middle" font-size="17" fill="#1f4e9c" font-weight="bold">STANDARD</text>
<text x="150" y="184" text-anchor="middle" font-size="12" fill="#1d2733">UI: Standard</text>
<text x="150" y="206" text-anchor="middle" font-size="12" fill="#6b7785">nvmxnet3 / vendor driver</text>
<text x="150" y="226" text-anchor="middle" font-size="12" fill="#6b7785">no lcores</text>
<rect x="430" y="130" width="260" height="120" rx="8" fill="#ffffff" stroke="#0b7a75" stroke-width="2.4"/>
<text x="560" y="162" text-anchor="middle" font-size="17" fill="#0b7a75" font-weight="bold">ENS_INTERRUPT</text>
<text x="560" y="184" text-anchor="middle" font-size="12" fill="#1d2733">UI: Enhanced Datapath – Standard</text>
<text x="560" y="206" text-anchor="middle" font-size="12" fill="#6b7785">_ens driver, interrupt mode</text>
<text x="560" y="226" text-anchor="middle" font-size="12" fill="#6b7785">no lcores</text>
<rect x="840" y="130" width="260" height="120" rx="8" fill="#ffffff" stroke="#5b3fa0" stroke-width="2.4"/>
<text x="970" y="162" text-anchor="middle" font-size="17" fill="#5b3fa0" font-weight="bold">ENS</text>
<text x="970" y="184" text-anchor="middle" font-size="12" fill="#1d2733">UI: Enhanced Datapath – Performance</text>
<text x="970" y="206" text-anchor="middle" font-size="12" fill="#6b7785">_ens driver, polling lcores</text>
<text x="970" y="226" text-anchor="middle" font-size="12" fill="#6b7785">cpu_config required</text>
<path d="M280,165 L430,165" fill="none" stroke="#0b7a75" stroke-width="2.6" marker-end="url(#at)"/>
<path d="M430,215 L280,215" fill="none" stroke="#0b7a75" stroke-width="2.6" marker-end="url(#at)"/>
<path d="M690,165 L840,165" fill="none" stroke="#5b3fa0" stroke-width="2.6" marker-end="url(#ap)"/>
<path d="M840,215 L690,215" fill="none" stroke="#5b3fa0" stroke-width="2.6" marker-end="url(#ap)"/>
<text x="355" y="155" text-anchor="middle" font-size="12" fill="#0b7a75" font-weight="bold">accepted</text>
<text x="355" y="236" text-anchor="middle" font-size="12" fill="#0b7a75" font-weight="bold">accepted</text>
<text x="765" y="155" text-anchor="middle" font-size="12" fill="#5b3fa0" font-weight="bold">accepted</text>
<text x="765" y="236" text-anchor="middle" font-size="12" fill="#5b3fa0" font-weight="bold">accepted</text>
<path d="M150,250 C150,340 970,340 970,252" fill="none" stroke="#b3261e" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<path d="M960,252 C960,325 160,325 160,252" fill="none" stroke="#b3261e" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<rect x="330" y="342" width="460" height="62" rx="6" fill="#fdf1f0" stroke="#b3261e" stroke-width="1.8"/>
<text x="560" y="366" text-anchor="middle" font-size="14" fill="#b3261e" font-weight="bold">STANDARD ⇄ ENS directly: rejected, error 9544</text>
<text x="560" y="388" text-anchor="middle" font-size="12" fill="#b3261e" font-style="italic">“Please delete the HostSwitch and create it back with intended Mode.”</text>
<text x="560" y="440" text-anchor="middle" font-size="12.5" fill="#6b7785">So EDP Performance is always two hops away from Standard, in both directions. The UI only lists the modes you can reach from where you are.</text></svg>