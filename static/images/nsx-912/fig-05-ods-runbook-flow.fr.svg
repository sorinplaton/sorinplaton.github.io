<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="338" viewBox="0 0 1400 338" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1d2733">
<rect width="1400" height="338" fill="#ffffff"/>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d2733"/></marker><marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f4e9c"/></marker><marker id="arrg" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arrt" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b7a75"/></marker><marker id="arrp" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b3fa0"/></marker><marker id="arrm" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7785"/></marker><marker id="arry" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa5b1"/></marker></defs>
<text x="700.0" y="30" font-size="21" fill="#1d2733" text-anchor="middle" font-weight="bold">Un runbook ODS, de l'alarme au rapport</text>
<text x="700.0" y="54" font-size="13" fill="#6b7785" text-anchor="middle">L'Online Diagnostic System dans l'interface de NSX Manager, à partir de NSX 9.1.2</text>
<rect x="40" y="90" width="236" height="90" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="58" cy="110" r="11" fill="#0b7a75"/><text x="58" y="114.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="76" y="115" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Une alarme se déclenche</text>
<text x="54" y="136.0" font-size="12.1" fill="#6b7785" text-anchor="start">une alarme associée</text>
<text x="54" y="152.5" font-size="12.1" fill="#6b7785" text-anchor="start">à un runbook</text>
<path d="M276,135 L306,135" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="308" y="90" width="236" height="90" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="326" cy="110" r="11" fill="#0b7a75"/><text x="326" y="114.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="344" y="115" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">NSX recommande</text>
<text x="322" y="136.0" font-size="12.1" fill="#6b7785" text-anchor="start">l'article de la KB et</text>
<text x="322" y="152.5" font-size="12.1" fill="#6b7785" text-anchor="start">le runbook à lancer</text>
<path d="M544,135 L574,135" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="576" y="90" width="236" height="90" rx="6" fill="#f4f7fb" stroke="#1f4e9c" stroke-width="1.4"/>
<circle cx="594" cy="110" r="11" fill="#1f4e9c"/><text x="594" y="114.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="612" y="115" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Vous le lancez</text>
<text x="590" y="136.0" font-size="12.1" fill="#6b7785" text-anchor="start">Plan &amp; Troubleshoot ›</text>
<text x="590" y="152.5" font-size="12.1" fill="#6b7785" text-anchor="start">ODS Runbooks</text>
<path d="M812,135 L842,135" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="844" y="90" width="236" height="90" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="862" cy="110" r="11" fill="#0b7a75"/><text x="862" y="114.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="880" y="115" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Il s'exécute dans le nœud</text>
<text x="858" y="136.0" font-size="12.1" fill="#6b7785" text-anchor="start">NSX Edge, hôte ESX</text>
<text x="858" y="152.5" font-size="12.1" fill="#6b7785" text-anchor="start">ou NSX Manager</text>
<path d="M1080,135 L1110,135" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1112" y="90" width="236" height="90" rx="6" fill="#f4f7fb" stroke="#1f4e9c" stroke-width="1.4"/>
<circle cx="1130" cy="110" r="11" fill="#1f4e9c"/><text x="1130" y="114.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="1148" y="115" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Vous obtenez un rapport</text>
<text x="1126" y="136.0" font-size="12.1" fill="#6b7785" text-anchor="start">View Details, plus des</text>
<text x="1126" y="152.5" font-size="12.1" fill="#6b7785" text-anchor="start">artefacts à télécharger</text>
<rect x="40" y="198" width="16" height="11" rx="2" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<text x="64" y="208" font-size="12.1" fill="#6b7785" text-anchor="start">NSX s'en charge</text>
<rect x="180" y="198" width="16" height="11" rx="2" fill="#f4f7fb" stroke="#1f4e9c" stroke-width="1.4"/>
<text x="204" y="208" font-size="12.1" fill="#6b7785" text-anchor="start">c'est à vous</text>
<text x="330" y="208" font-size="12.1" fill="#6b7785" text-anchor="start" font-style="italic">Vous pouvez aussi commencer à l'étape 3 sans alarme : ouvrez le menu à trois points du runbook et choisissez Invoke Runbook.</text>
<rect x="60" y="228" width="1280" height="64" rx="6" fill="#fff7e6" stroke="none"/>
<text x="80" y="250" font-size="11" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">RUNBOOKS PRÉDÉFINIS DANS L'INTERFACE</text>
<text x="80" y="268.0" font-size="12.1" fill="#1d2733" text-anchor="start">EdgeHealth · BgpNeighborState · EdgeDpBfd · LBScale · IPSecVPNSession · OverlayTunnel · AdfCollect · CorfuServer · CcpTNConnection</text>
<text x="80" y="285.6" font-size="12.1" fill="#1d2733" text-anchor="start">Runbooks dynamiques à importer : le runbook LB et le runbook Hyperbus. Tous les runbooks prédéfinis ne sont pas dans l'interface ; les autres passent par l'API.</text>
</svg>
