<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1d2733">
<rect width="1400" height="640" fill="#ffffff"/>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d2733"/></marker><marker id="arrs" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1d2733"/></marker><marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f4e9c"/></marker><marker id="arrbs" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1f4e9c"/></marker><marker id="arrg" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e7d32"/></marker><marker id="arrgs" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#2e7d32"/></marker><marker id="arrt" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b7a75"/></marker><marker id="arrts" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#0b7a75"/></marker><marker id="arrp" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b3fa0"/></marker><marker id="arrps" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#5b3fa0"/></marker><marker id="arrr" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b23a3a"/></marker><marker id="arrrs" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#b23a3a"/></marker><marker id="arrm" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7785"/></marker><marker id="arrms" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#6b7785"/></marker></defs>
<text x="700.0" y="30" text-anchor="middle" font-size="21" font-weight="bold">Unplanned failover of the fleet components: the runbook, in order</text>
<text x="700.0" y="54" text-anchor="middle" font-size="13" fill="#6b7785">Site A is unavailable. Recover the network first, then run the recovery plan, then rebuild what is not replicated</text>
<rect x="40" y="80" width="1035" height="150" rx="6" fill="none" stroke="#5b3fa0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="52" y="98" font-size="13.2" fill="#5b3fa0" text-anchor="start" font-weight="bold">NSX — Global Manager at Site B</text>
<rect x="40" y="300" width="1035" height="150" rx="6" fill="none" stroke="#b23a3a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="52" y="318" font-size="13.2" fill="#b23a3a" text-anchor="start" font-weight="bold">Protection &amp; Recovery — recovery plan</text>
<rect x="40" y="470" width="1035" height="130" rx="6" fill="none" stroke="#0b7a75" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="52" y="488" font-size="13.2" fill="#0b7a75" text-anchor="start" font-weight="bold">VCF Operations at Site B — restore from backup</text>
<rect x="60" y="110" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#5b3fa0" stroke-width="1.4"/>
<circle cx="78" cy="130" r="11" fill="#5b3fa0"/>
<text x="78" y="134.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="96" y="135" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Promote the standby GM</text>
<text x="74" y="156.0" font-size="12.1" fill="#6b7785" text-anchor="start">System › Location Manager › Make Active</text>
<text x="74" y="172.5" font-size="12.1" fill="#6b7785" text-anchor="start">Manual — no automatic GM failover</text>
<text x="74" y="189.0" font-size="12.1" fill="#6b7785" text-anchor="start">Takes several minutes; LM-B keeps forwarding</text>
<rect x="400" y="110" width="320" height="96" rx="6" fill="#f4f7fb" stroke="#5b3fa0" stroke-width="1.4"/>
<circle cx="418" cy="130" r="11" fill="#5b3fa0"/>
<text x="418" y="134.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="436" y="135" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Network Recovery: Location B primary</text>
<text x="414" y="156.0" font-size="12.1" fill="#6b7785" text-anchor="start">Stretched Tier-0 → new primary location B</text>
<text x="414" y="172.5" font-size="12.1" fill="#6b7785" text-anchor="start">Tier-1 follows if same span; else pick B</text>
<text x="414" y="189.0" font-size="12.1" fill="#6b7785" text-anchor="start">Stretched gateways never fail over on their own</text>
<rect x="760" y="110" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#5b3fa0" stroke-width="1.4"/>
<circle cx="778" cy="130" r="11" fill="#5b3fa0"/>
<text x="778" y="134.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="796" y="135" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Check the prefix</text>
<text x="774" y="156.0" font-size="12.1" fill="#6b7785" text-anchor="start">Tier-0 B now advertises seg-vcf-mgmt</text>
<text x="774" y="172.5" font-size="12.1" fill="#6b7785" text-anchor="start">without the secondary-location prepend</text>
<text x="774" y="189.0" font-size="12.1" fill="#6b7785" text-anchor="start">DNS unchanged — same IPs, same FQDNs</text>
<path d="M360,158 L400,158" fill="none" stroke="#5b3fa0" stroke-width="1.6" marker-end="url(#arrp)"/>
<path d="M720,158 L760,158" fill="none" stroke="#5b3fa0" stroke-width="1.6" marker-end="url(#arrp)"/>
<path d="M910,206 L910,240 L210,240 L210,330" fill="none" stroke="#b23a3a" stroke-width="1.6" marker-end="url(#arrr)"/>
<text x="560" y="258" font-size="12.1" fill="#6b7785" text-anchor="middle">network is ready before any VM powers on</text>
<rect x="60" y="330" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#b23a3a" stroke-width="1.4"/>
<circle cx="78" cy="350" r="11" fill="#b23a3a"/>
<text x="78" y="354.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="96" y="355" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Run the recovery plan (DR mode)</text>
<text x="74" y="376.0" font-size="12.1" fill="#6b7785" text-anchor="start">Protection group: Ops cluster + Ops for Networks</text>
<text x="74" y="392.5" font-size="12.1" fill="#6b7785" text-anchor="start">Latest replica, crash-consistent</text>
<text x="74" y="409.0" font-size="12.1" fill="#6b7785" text-anchor="start">Target: management cluster B, same segment</text>
<rect x="400" y="330" width="320" height="96" rx="6" fill="#f4f7fb" stroke="#b23a3a" stroke-width="1.4"/>
<circle cx="418" cy="350" r="11" fill="#b23a3a"/>
<text x="418" y="354.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="436" y="355" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Priority order</text>
<text x="414" y="376.0" font-size="12.1" fill="#6b7785" text-anchor="start">Ops primary → replica → data nodes</text>
<text x="414" y="392.5" font-size="12.1" fill="#6b7785" text-anchor="start">then Ops for Networks platform → collectors</text>
<text x="414" y="409.0" font-size="12.1" fill="#6b7785" text-anchor="start">Maintain the plan when you add nodes</text>
<rect x="760" y="330" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#b23a3a" stroke-width="1.4"/>
<circle cx="778" cy="350" r="11" fill="#b23a3a"/>
<text x="778" y="354.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="796" y="355" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Prompt: site-B collectors</text>
<text x="774" y="376.0" font-size="12.1" fill="#6b7785" text-anchor="start">Power on / confirm cloud proxy and collector B</text>
<text x="774" y="392.5" font-size="12.1" fill="#6b7785" text-anchor="start">Re-point adapters that used collector A</text>
<text x="774" y="409.0" font-size="12.1" fill="#6b7785" text-anchor="start">Only site-B endpoints are reachable now</text>
<path d="M360,378 L400,378" fill="none" stroke="#b23a3a" stroke-width="1.6" marker-end="url(#arrr)"/>
<path d="M720,378 L760,378" fill="none" stroke="#b23a3a" stroke-width="1.6" marker-end="url(#arrr)"/>
<path d="M910,426 L910,450 L390,450 L390,500" fill="none" stroke="#0b7a75" stroke-width="1.6" marker-end="url(#arrt)"/>
<rect x="60" y="500" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="78" cy="520" r="11" fill="#0b7a75"/>
<text x="78" y="524.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
<text x="96" y="525" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">VCF Automation: new instance</text>
<text x="74" y="546.0" font-size="12.1" fill="#6b7785" text-anchor="start">Fleet Management › Lifecycle › Components</text>
<text x="74" y="562.5" font-size="12.1" fill="#6b7785" text-anchor="start">Deploy at B (same segment, same IPs if free)</text>
<text x="74" y="579.0" font-size="12.1" fill="#6b7785" text-anchor="start">Backup and Restore › Restore latest</text>
<rect x="400" y="500" width="320" height="96" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="418" cy="520" r="11" fill="#0b7a75"/>
<text x="418" y="524.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="436" y="525" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Mgmt-services components</text>
<text x="414" y="546.0" font-size="12.1" fill="#6b7785" text-anchor="start">Identity Broker, depot, Salt, log mgmt</text>
<text x="414" y="562.5" font-size="12.1" fill="#6b7785" text-anchor="start">Restore onto B's existing mgmt-services instance</text>
<text x="414" y="579.0" font-size="12.1" fill="#6b7785" text-anchor="start">One instance of each per mgmt-services instance</text>
<rect x="760" y="500" width="300" height="96" rx="6" fill="#f4f7fb" stroke="#0b7a75" stroke-width="1.4"/>
<circle cx="778" cy="520" r="11" fill="#0b7a75"/>
<text x="778" y="524.5" font-size="13.2" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
<text x="796" y="525" font-size="13.2" fill="#1d2733" text-anchor="start" font-weight="bold">Validate, then plan the way back</text>
<text x="774" y="546.0" font-size="12.1" fill="#6b7785" text-anchor="start">Logins via Identity Broker · adapters green</text>
<text x="774" y="562.5" font-size="12.1" fill="#6b7785" text-anchor="start">Automation orgs / VPCs visible</text>
<text x="774" y="579.0" font-size="12.1" fill="#6b7785" text-anchor="start">Reprotect A→B becomes B→A; GM-A → standby</text>
<path d="M360,548 L400,548" fill="none" stroke="#0b7a75" stroke-width="1.6" marker-end="url(#arrt)"/>
<path d="M720,548 L760,548" fill="none" stroke="#0b7a75" stroke-width="1.6" marker-end="url(#arrt)"/>
<rect x="1090" y="110" width="250" height="486" rx="6" fill="#fff7e6" stroke="none" stroke-width="1.4"/>
<text x="1106" y="134" font-size="12.1" fill="#8a6d00" text-anchor="start" font-weight="bold" letter-spacing="1.5">WHY THIS ORDER</text>
<text x="1106" y="158.0" font-size="12.1" fill="#1d2733" text-anchor="start">Steps 1–3 exist because the</text>
<text x="1106" y="175.6" font-size="12.1" fill="#1d2733" text-anchor="start">segment's gateway is active in</text>
<text x="1106" y="193.2" font-size="12.1" fill="#1d2733" text-anchor="start">one location only. With Site A</text>
<text x="1106" y="210.8" font-size="12.1" fill="#1d2733" text-anchor="start">down, Site B still carries the</text>
<text x="1106" y="228.4" font-size="12.1" fill="#1d2733" text-anchor="start">segment on its hosts, but north-</text>
<text x="1106" y="246.0" font-size="12.1" fill="#1d2733" text-anchor="start">south stops until B is primary.</text>
<text x="1106" y="263.6" font-size="12.1" fill="#1d2733" text-anchor="start"></text>
<text x="1106" y="281.20000000000005" font-size="12.1" fill="#1d2733" text-anchor="start">Steps 4–6 are the only part that</text>
<text x="1106" y="298.8" font-size="12.1" fill="#1d2733" text-anchor="start">needs IP mobility: the Ops</text>
<text x="1106" y="316.4" font-size="12.1" fill="#1d2733" text-anchor="start">nodes come back with the IPs</text>
<text x="1106" y="334.0" font-size="12.1" fill="#1d2733" text-anchor="start">and certificates they had.</text>
<text x="1106" y="351.6" font-size="12.1" fill="#1d2733" text-anchor="start"></text>
<text x="1106" y="369.20000000000005" font-size="12.1" fill="#1d2733" text-anchor="start">Steps 7–8 do not need IP mobility</text>
<text x="1106" y="386.8" font-size="12.1" fill="#1d2733" text-anchor="start">— the blueprint rebuilds</text>
<text x="1106" y="404.40000000000003" font-size="12.1" fill="#1d2733" text-anchor="start">Automation and the fleet</text>
<text x="1106" y="422.0" font-size="12.1" fill="#1d2733" text-anchor="start">services from backup. Putting</text>
<text x="1106" y="439.6" font-size="12.1" fill="#1d2733" text-anchor="start">them on the stretched segment</text>
<text x="1106" y="457.20000000000005" font-size="12.1" fill="#1d2733" text-anchor="start">just lets you reuse the same</text>
<text x="1106" y="474.8" font-size="12.1" fill="#1d2733" text-anchor="start">FQDNs and addresses.</text>
<text x="1106" y="492.40000000000003" font-size="12.1" fill="#1d2733" text-anchor="start"></text>
<text x="1106" y="510.0" font-size="12.1" fill="#1d2733" text-anchor="start">RTO target in the blueprint:</text>
<text x="1106" y="527.6" font-size="12.1" fill="#1d2733" text-anchor="start">4 hours or less.</text>
</svg>
