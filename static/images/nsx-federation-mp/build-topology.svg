<text x="300.0" y="650.0" font-size="12" fill="#6b7785" text-anchor="middle">nsx-wld01-a · nsx-wld03-a</text>
<rect x="760" y="450" width="800" height="250" rx="6" fill="#fdf7f0" stroke="#b25e00" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="774" y="472" font-size="13" fill="#b25e00" text-anchor="start" font-weight="bold" letter-spacing="1">CLOUD PROXY · opscollector-01a</text>
