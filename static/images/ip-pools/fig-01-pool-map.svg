<text x="780.0" y="30" text-anchor="middle" font-size="19" font-weight="bold">Every pool and block in a VCF 9.1 domain, and the component that consumes it</text>
<text x="780.0" y="50" text-anchor="middle" font-size="12" fill="#6b7785">Centralized model shown (Edge cluster + Tier-0). Pills on the right are the pools; the dotted leader shows where each one is consumed.</text>
