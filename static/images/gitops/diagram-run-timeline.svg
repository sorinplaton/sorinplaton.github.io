<text x="700.0" y="30" font-size="19" fill="#1d2733" text-anchor="middle" font-weight="bold">From a 40-line commit to a self-healing app, in seven steps</text>
<text x="140" y="100" font-size="11" fill="#6b7785" font-weight="bold">WHAT HAPPENS</text>
<text x="740" y="100" font-size="11" fill="#6b7785" font-weight="bold">LAB TIMING</text>
<text x="1130" y="100" font-size="11" fill="#6b7785" font-weight="bold">WHAT EXISTS NOW</text>
<path d="M88 150 L88 768" fill="none" stroke="#c9d1da" stroke-width="2"/>
<circle cx="88" cy="150" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="155" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">1</text>
<text x="140" y="148" font-size="15" fill="#1d2733" font-weight="bold">Commit the Cluster object</text>
<text x="140" y="168" font-size="12" fill="#6b7785">clusters/demo-vks-cluster/cluster.yaml</text>
<text x="740" y="155" font-size="13" fill="#1d2733">manual sync, by design</text>
<circle cx="88" cy="253" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="258" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">2</text>
<text x="140" y="251" font-size="15" fill="#1d2733" font-weight="bold">Sync demo-vks-cluster</text>
<text x="140" y="271" font-size="12" fill="#6b7785">Argo CD applies one object, the Supervisor builds</text>
<text x="740" y="258" font-size="13" fill="#1d2733">59 s to first VM object</text>
<circle cx="88" cy="356" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="361" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">3</text>
<text x="140" y="354" font-size="15" fill="#1d2733" font-weight="bold">The Supervisor builds the nodes</text>
<text x="140" y="374" font-size="12" fill="#6b7785">3 control-plane and 3 worker VMs, Photon</text>
<text x="740" y="361" font-size="13" fill="#1d2733">about 30 min, clean</text>
<circle cx="88" cy="459" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="464" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">4</text>
<text x="140" y="457" font-size="15" fill="#1d2733" font-weight="bold">Register the cluster as target 2</text>
<text x="140" y="477" font-size="12" fill="#6b7785">vcf argocd cluster add demo-vks-cluster</text>
<text x="740" y="464" font-size="13" fill="#1d2733">seconds</text>
<circle cx="88" cy="562" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="567" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">5</text>
<text x="140" y="560" font-size="15" fill="#1d2733" font-weight="bold">Commit podinfo, automated sync</text>
<text x="140" y="580" font-size="12" fill="#6b7785">apps/podinfo/podinfo.yaml, replicas: 1</text>
<text x="740" y="567" font-size="13" fill="#1d2733">page up 1 s after VIP</text>
<circle cx="88" cy="665" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="670" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">6</text>
<text x="140" y="663" font-size="15" fill="#1d2733" font-weight="bold">Push replicas: 3. Do nothing else</text>
<text x="140" y="683" font-size="12" fill="#6b7785">Argo CD polls Git and applies it</text>
<text x="740" y="670" font-size="13" fill="#1d2733">16 s to three pods</text>
<circle cx="88" cy="768" r="18" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2"/>
<text x="88" y="773" font-size="14" fill="#1f4e9c" text-anchor="middle" font-weight="bold">7</text>
<text x="140" y="766" font-size="15" fill="#1d2733" font-weight="bold">Scale back to 1 by hand</text>
<text x="140" y="786" font-size="12" fill="#6b7785">drift: Argo CD puts Git&#x27;s answer back</text>
<text x="740" y="773" font-size="13" fill="#1d2733">4 s to three pods again</text>
<text x="1130" y="155" font-size="13" fill="#6b7785">an empty namespace</text>
